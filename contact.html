<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact Us — Knots by Liza</title>
<meta name="description" content="Get in touch with Knots by Liza on WhatsApp or Instagram for orders, questions or custom requests." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

<div id="navbar-root"></div>

<main>
  <div class="page-header container">
    <h1>Get in Touch</h1>
    <p>Have a custom crochet idea? Let's bring it to life</p>
  </div>

  <section class="section container">
    <div class="contact-grid">
      <div class="contact-card">
        <div class="contact-card__icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 11.5a8.5 8.5 0 0 1-12.36 7.57L4 20l1.02-4.42A8.5 8.5 0 1 1 21 11.5Z"/></svg>
        </div>
        <h3>WhatsApp</h3>
        <p style="color:var(--ink-muted); font-size:0.9rem"></p>
        <a id="contact-whatsapp" href="#" target="_blank" rel="noopener" class="btn btn--whatsapp btn--small" style="margin-top:12px">Send a message</a>
      </div>
      <div class="contact-card">
        <div class="contact-card__icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M8 5l2-2h4l2 2"/><circle cx="12" cy="12.5" r="3.5"/></svg>
        </div>
        <h3>Instagram</h3>
        <p style="color:var(--ink-muted); font-size:0.9rem" id="contact-instagram-handle"></p>
        <a id="contact-instagram" href="#" target="_blank" rel="noopener" class="btn btn--secondary btn--small" style="margin-top:12px">Follow</a>
      </div>
      <div class="contact-card">
        <div class="contact-card__icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 6.5l9 6 9-6"/></svg>
        </div>
        <h3>Email</h3>
        <p style="color:var(--ink-muted); font-size:0.9rem" id="contact-email"></p>
      </div>
      <div class="contact-card">
        <div class="contact-card__icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        </div>
        <h3>Response Hours</h3>
        <p style="color:var(--ink-muted); font-size:0.9rem" id="contact-hours"></p>
      </div>
    </div>
  </section>
</main>

<div id="footer-root"></div>

<script type="module" src="assets/js/pages/contact.js"></script>
</body>
</html>
