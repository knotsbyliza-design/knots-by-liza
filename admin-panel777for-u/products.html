<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manage Products — Knots by Liza Admin</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>

<div id="admin-login-root"></div>
<div class="admin-shell" id="admin-content" style="display:none">
  <div id="admin-sidebar-root"></div>
  <main class="admin-main" id="admin-main">
        <div class="admin-topbar">
      <h1 style="margin:0">Products</h1>
    </div>

    <div class="shop-toolbar" style="margin-bottom:20px">
      <label class="search-input" style="max-width:320px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input type="text" id="admin-search" placeholder="Search products..." />
      </label>
      <select class="select-input" id="admin-category-filter" style="max-width:200px"></select>
    </div>

    <div style="overflow-x:auto">
      <table class="admin-table" id="products-table"></table>
    </div>
  </main>
</div>

<div id="product-modal-root"></div>

<script type="module" src="../assets/js/pages/admin-products.js"></script>
</body>
</html>
